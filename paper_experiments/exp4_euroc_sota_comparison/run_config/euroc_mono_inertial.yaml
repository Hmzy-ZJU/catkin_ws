# Exp.4 EuRoC mono-inertial base configuration.
# Edit this file to change experiment parameters; the script only injects mode switches and log paths.

File.version: "1.0"
UWIDVO.Mode: "IDVO"

Camera.type: "PinHole"

Camera1.fx: 458.654
Camera1.fy: 457.296
Camera1.cx: 367.215
Camera1.cy: 248.375
Camera1.k1: -0.28340811
Camera1.k2: 0.07395907
