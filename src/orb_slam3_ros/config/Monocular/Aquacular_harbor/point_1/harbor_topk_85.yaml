%YAML:1.0

#==================== Camera Model ====================
# Aqualoc_deepsea / harbor_sequence_1
# 原始标注 distortion_model: equidistant -> ORB-SLAM3 用 KannalaBrandt8
Camera.type: "KannalaBrandt8"

# 内参
Camera.fx: 413.32595366566017
Camera.fy: 413.70198739483686
Camera.cx: 305.9507483284928
Camera.cy: 259.4439948946375

# 等距鱼眼（KB8）畸变参数（k1..k4）
Camera.k1: -0.06125568297136998
Camera.k2: -0.003796743395135256
Camera.k3:  0.027326634771204592
Camera.k4: -0.030296403142887066

# 图像尺寸
Camera.width: 640
Camera.height: 512

# 其他
Camera.fps: 20.0
Camera.RGB: true

#==================== ORB Extractor ====================
# 水下/低纹理：适度多特征 + 降低 FAST 初阈
ORBextractor.nFeatures: 900
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 12
ORBextractor.minThFAST: 7


#==================== Viewer ====================
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
# ==================== UW-Fusion（从 YAML 读取） ====================
# Enhance-Default（默认增强）
uwfusion.enable: 0
uwfusion.levels: 4
uwfusion.scb_percent: 0.6
uwfusion.bilateral_d: 3
uwfusion.bilateral_sigma_color: 4.0
uwfusion.bilateral_sigma_space: 3.5
uwfusion.clahe_clip: 1.4
uwfusion.clahe_tile: 8
uwfusion.exposed_avg: 0.5
uwfusion.exposed_sigma: 0.25

# ==================== InfoSelector（点号扁平写法） ====================
InfoSelector.Enable: 1
InfoSelector.TopK: 85

InfoSelector.w_uniform: 0.12
InfoSelector.MinPxDist: 7
InfoSelector.UseUniform: 1
InfoSelector.LambdaInit: 1.0e-3


# =============== InfoKF (keyframe gating) ===============
InfoKF.Use: 0
InfoKF.AllowBitsDrop: 0.01        # 基本阈值 τ（正数）
# 基本阈值 τ_basic（单位：bit）。判据之一：当 ΔE < -τ_basic 时允许插帧。
# 物理含义：ΔE = 0.5 * log2(|Λ_curr|/|Λ_ref|)。ΔE 为负表示信息下降（不确定性增大）。
# 数学换算：|Λ_curr|/|Λ_ref| < 2^(-2*τ_basic) 时触发。例如 τ_basic=0.02 → 比例约 < 0.972（≈ 2.8% 下降）。
# 调大：更“保守”，信息必须明显下降才插帧 → KF 更少、速度更快但易掉追踪。
# 调小：更“激进”，轻微下降就插帧 → KF 更多、鲁棒性更好但算力/内存更高。
# 建议：0.02~0.10 之间微调；场景变化快/纹理弱时选小一些（0.02~0.05）。
InfoKF.LambdaMean: 1.0e-3

# 动态阈值 τ_t = α*(1 - n_matches/n_ref) + β，且裁剪到 [τ_min, τ_max]
InfoKF.Dyn.Alpha: 0.02            # α（匹配少时放宽）
# α：乘在 (1 - ratio) 上的系数。当前公式下，“匹配越少 τ_t 越大（越严格）”的主控参数。
# 调大：匹配少的时刻阈值被拉得更高 → 更不容易插帧 → KF 更少，可能导致断跟。
# 调小：弱纹理/对准变差时更容易过门 → KF 稍多、更稳。
# 若你希望“匹配少更宽松”，请将公式改成 τ_t = α + β*ratio；此时 α 是“最低阈值”。
InfoKF.Dyn.Beta:  0.20            # β（基线阈值）
# β：动态阈值的基线项（始终加上）。
# 调大：整体阈值上移（更严格）→ KF 更少。
# 调小：整体阈值下移（更宽松）→ KF 更多。
# 一般与 Alpha 共同决定动态阈值的区间中心
InfoKF.Dyn.TauMin: 0.03
InfoKF.Dyn.TauMax: 0.60

# 累计下降 D_t = ρ*D_{t-1} + min(0,ΔE_t)；触发 D_t < -Θ_cum
InfoKF.Cum.Decay: 0.95            # ρ （0.9~0.98）
# ρ：记忆衰减系数（0.9~0.98 常用）。
# 调大（趋近 1）：记忆更长，“慢慢变差”也会被积累出来 → 更容易触发 KF。
# 调小：记忆更短，只对近期下降敏感 → 不容易触发。
# 建议：0.95~0.97。轨迹长/运动平缓用更大；快动/快变化用更小。

InfoKF.Cum.Thr:   0.5            # Θ_cum（正值）：累计下降超过 2 bits 则插帧
# Θ_cum（单位：bit）：累计下降的触发阈值。判据：D_t < -Θ_cum 时插帧。
# 调大：必须累计更多“负ΔE”才触发 → KF 更少。
# 调小：轻度/缓慢退化也能触发 → KF 更多。



# 最大帧距约束
InfoKF.MaxFramesForce: 10        # 超过 20 帧强制插 KF
