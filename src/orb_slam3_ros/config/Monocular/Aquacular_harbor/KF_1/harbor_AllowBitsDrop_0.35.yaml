%YAML:1.0

#==================== Camera Model ====================
# Aqualoc_deepsea / harbor_sequence_1
# 原始标注 distortion_model: equidistant -> ORB-SLAM3 用 KannalaBrandt8
Camera.type: "KannalaBrandt8"

# 内参
Camera.fx: 413.32595366566017
Camera.fy: 413.70198739483686
Camera.cx: 305.9507483284928
Camera.cy: 259.4439948946375

# 等距鱼眼（KB8）畸变参数（k1..k4）
Camera.k1: -0.06125568297136998
Camera.k2: -0.003796743395135256
Camera.k3:  0.027326634771204592
Camera.k4: -0.030296403142887066

# 图像尺寸
Camera.width: 640
Camera.height: 512

# 其他
Camera.fps: 20.0
Camera.RGB: true

#==================== ORB Extractor ====================
# 水下/低纹理：适度多特征 + 降低 FAST 初阈
ORBextractor.nFeatures: 900
ORBextractor.scaleFactor: 1.2
ORBextractor.nLevels: 8
ORBextractor.iniThFAST: 12
ORBextractor.minThFAST: 7


#==================== Viewer ====================
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
# ==================== UW-Fusion（从 YAML 读取） ====================
# Enhance-Default（默认增强）
uwfusion.enable: 1
uwfusion.levels: 4
uwfusion.scb_percent: 0.6
uwfusion.bilateral_d: 3
uwfusion.bilateral_sigma_color: 4.0
uwfusion.bilateral_sigma_space: 3.5
uwfusion.clahe_clip: 1.4
uwfusion.clahe_tile: 8
uwfusion.exposed_avg: 0.5
uwfusion.exposed_sigma: 0.25

# ==================== InfoSelector（点号扁平写法） ====================
InfoSelector.Enable: 1
InfoSelector.TopK: 95
InfoSelector.UseUniform: 1
InfoSelector.w_uniform: 0.12
InfoSelector.MinPxDist: 7

InfoSelector.LambdaInit: 1.0e-3


# =============== InfoKF (keyframe gating) ===============
InfoKF.Use: 1             # 打开信息论关键帧门控
InfoKF.AllowBitsDrop: 0.35 # T0：信息变化容忍度（主参数）

# 自适应强度（轻微即可）
InfoKF.Dyn.Alpha: 0.25       # 影响 Teff 的幅度不要太大
InfoKF.Dyn.Beta:  0.0       # 暂时不用，可以留着以后扩展

# 自适应阈值上下界（建议）
InfoKF.Dyn.TauMin: 0.15
InfoKF.Dyn.TauMax: 0.8

# 累计量 & 帧距兜底
InfoKF.Cum.Decay: 0.95
InfoKF.Cum.Thr:   0.5
InfoKF.MaxFramesForce: 300  # 目前你说先不启用，可以先设很大

